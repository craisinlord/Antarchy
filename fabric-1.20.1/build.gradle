plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.15.5'
    id 'maven-publish'
}

group = mod_group_id
version = "${mod_version}+${project.name}"

base {
    archivesName = "${mod_id}-fabric-1.20.1"
}

repositories {
    maven { url "https://maven.fabricmc.net/" }
    mavenCentral()
    maven { url "https://www.cursemaven.com" }
    maven { url "https://maven.architectury.dev/" }
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://maven.blamejared.com" }
    maven { url "https://repo.spongepowered.org/repository/maven-public/" }
    maven { url "https://jitpack.io" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.shedaniel.me/" }
    exclusiveContent {
        forRepository {
            maven {
                name = "GeckoLib"
                url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
            }
        }
        filter {
            includeGroup("software.bernie.geckolib")
            includeGroup("com.eliotlash.mclib")
        }
    }
}

tasks.withType(AbstractCopyTask).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    withSourcesJar()
}

sourceSets {
    main {
        java {
            srcDirs += file('../common-1.20.1/src/main/java')
        }
        resources {
            srcDirs += file('../common-1.20.1/src/main/resources')
        }
    }
}

configurations.configureEach {
    resolutionStrategy.force "net.fabricmc:fabric-loader:${fabric_loader_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    modImplementation "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"

    modImplementation(files("$rootDir/../anthology_jars/anthology-${anthology_version}+1.20.1-fabric.jar"))

    modCompileOnly("curse.maven:sizeable_foliage-${sizeable_foliage_curseforge_id}:${sizeable_foliage_curseforge_file_id_fabric}")
    modLocalRuntime("curse.maven:sizeable_foliage-${sizeable_foliage_curseforge_id}:${sizeable_foliage_curseforge_file_id_fabric}")

    modCompileOnly(files("$rootDir/../integrated_api_jars/integrated_api-fabric-1.20.1-1.9.1.jar"))
    modLocalRuntime(files("$rootDir/../integrated_api_jars/integrated_api-fabric-1.20.1-1.9.1.jar"))

    modCompileOnly(files("$rootDir/../infinite_dimensions_jars/Pehkui-3.7.8+1.14.4-1.20.1.jar"))
    modLocalRuntime(files("$rootDir/../infinite_dimensions_jars/Pehkui-3.7.8+1.14.4-1.20.1.jar"))

    modCompileOnly(files("$rootDir/../infinite_dimensions_jars/infinity-2.7.2+1.20.1-fabric.jar"))
    modLocalRuntime(files("$rootDir/../infinite_dimensions_jars/infinity-2.7.2+1.20.1-fabric.jar"))
    modLocalRuntime("dev.architectury:architectury-fabric:9.2.14")
    modLocalRuntime("maven.modrinth:midnightlib:1.9.3+1.20.1-fabric")
    modLocalRuntime(files("devlibs/KanosConfig-0.4.1.jar"))

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    modLocalRuntime "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"

    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:11.1.136") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modCompileOnly("com.terraformersmc:modmenu:7.2.2") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    annotationProcessor "org.spongepowered:mixin:0.8.7:processor"
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "antarchy.mixins.refmap.json"
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        version              : project.version,
        minecraft_version    : minecraft_version,
        fabric_loader_version: fabric_loader_version,
        mod_id               : mod_id,
        mod_name             : mod_name,
        mod_description      : mod_description,
        mod_author           : mod_author,
        license              : license,
        homepage_url         : homepage_url,
        issues_url           : issues_url,
        sources_url          : sources_url,
        logo_fabric          : logo_fabric
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.named('processResources', ProcessResources).configure {
    doLast {
        var commonMixinConfig = new File(destinationDir, 'antarchy-common.mixins.json')
        var json = new groovy.json.JsonSlurper().parse(commonMixinConfig)
        json.put('refmap', 'antarchy.mixins.refmap.json')
        commonMixinConfig.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.group
            artifactId = project.base.archivesName.get()
            version = project.version

            artifact(project.tasks.named('remapJar'))
            artifact(project.tasks.named('remapSourcesJar')) {
                classifier = 'sources'
            }

            pom {
                name = "${mod_name} (Fabric 1.20.1)"
                description = mod_description
            }
        }
    }
}
