plugins {
    id 'net.fabricmc.fabric-loom-remap'
    id "com.matthewprenger.cursegradle" version "1.4.0"
    id "me.modmuss50.mod-publish-plugin" version "0.5.1"
}

base {
    archivesName = mod_id
}
version = "${mod_version}+1.21.1-fabric"

tasks.withType(AbstractCopyTask).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

sourceSets {
    main {
        java {
            srcDirs project(':common-1.21.1').sourceSets.main.java.srcDirs
        }
        resources {
            srcDir project(':common-1.21.1').sourceSets.main.resources.srcDirs
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version_1_21_1}"
    modApi "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_1_21_1}"
    modLocalRuntime "maven.modrinth:midnightlib:${midnightlib}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-1.21.1:${geckolib_version}"
    modImplementation(files("$rootDir/anthology_jars/anthology-${anthology_version}+1.21.1-fabric.jar"))
    modImplementation(files("$rootDir/infinite_dimensions_jars/antos-fabric-1.21.1-${antos_version}.jar"))
    if (providers.gradleProperty('antarchySodiumCompatTest').orNull == 'true') {
        modLocalRuntime(files("$rootDir/infinite_dimensions_jars/sodium-fabric-0.8.13+mc1.21.1.jar"))
    }
    compileOnly(files(zipTree("$rootDir/infinite_dimensions_jars/sodium-neoforge-0.8.13+mc1.21.1.jar")
            .matching { include "META-INF/jarjar/net.caffeinemc.sodium-neoforge-*-mod.jar" }))
    modCompileOnly("curse.maven:intapi-${intapi_curseforge_id}:${intapi_curseforge_file_id_fabric}")
    modLocalRuntime("curse.maven:intapi-${intapi_curseforge_id}:${intapi_curseforge_file_id_fabric}")
    modLocalRuntime("dev.architectury:architectury-fabric:${architectury_api_version}")
    compileOnly "mezz.jei:jei-1.21.1-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-1.21.1-fabric-api:${jei_version}"
    modLocalRuntime "mezz.jei:jei-1.21.1-fabric:${jei_version}"

    modLocalRuntime(files("$rootDir/infinite_dimensions_jars/infinity-2.7.3+1.21.1-fabric.jar"))
    compileOnly(files("$rootDir/infinite_dimensions_jars/infinity-2.7.3+1.21.1-neoforge.jar"))
    compileOnly(files("$rootDir/infinite_dimensions_jars/gravity-api-1.0.7-1.20.1.jar"))
    compileOnly(files("$rootDir/infinite_dimensions_jars/sable-neoforge-1.21.1-2.0.3.jar"))
    compileOnly(files("$rootDir/infinite_dimensions_jars/stellarview-1.21.1-0.5.3-neoforge.jar"))

    modCompileOnly("curse.maven:cloth-config-${clothconfig_curseforge_id}:${clothconfig_curseforge_file_id}")
    modLocalRuntime("curse.maven:cloth-config-${clothconfig_curseforge_id}:${clothconfig_curseforge_file_id}")

    modCompileOnly "com.terraformersmc:modmenu:${mod_menu}"
    modLocalRuntime "com.terraformersmc:modmenu:${mod_menu}"

    compileOnly(files("$rootDir/sizeable_foliage_jars/sizeable_foliage-neoforge-1.21.1-1.0.0.jar"))
    modLocalRuntime(files("$rootDir/sizeable_foliage_jars/sizeable_foliage-fabric-1.21.1-1.0.0.jar"))

    annotationProcessor "org.spongepowered:mixin:0.8.7:processor"
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixin_extras_1_21_1}"))
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "antarchy.mixins.refmap.json"
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        version              : project.version,
        minecraft_version    : "1.21.1",
        fabric_loader_version: fabric_loader_version_1_21_1,
        architectury_api_version: architectury_api_version,
        mod_id               : mod_id,
        mod_name             : mod_name,
        mod_description      : mod_description,
        mod_author           : mod_author,
        license              : license,
        homepage_url         : homepage_url,
        issues_url           : issues_url,
        sources_url          : sources_url,
        logo_fabric          : logo_fabric
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.named('processResources', ProcessResources).configure {
    doLast {
        ['antarchy-common.mixins.json'].each { configName ->
            var mixinConfig = new File(destinationDir, configName)
            var json = new groovy.json.JsonSlurper().parse(mixinConfig)
            json.put('refmap', 'antarchy.mixins.refmap.json')
            mixinConfig.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
        }
    }
}

tasks.matching { it.name in ["runClient", "runServer", "runDatagen"] }.configureEach {
    doFirst {
        def infinityConfigPrefix = "config/common/"
        zipTree(rootProject.file("infinite_dimensions_jars/infinity-2.7.3+1.21.1-fabric.jar")).visit { details ->
            if (!details.directory && details.relativePath.pathString.startsWith(infinityConfigPrefix)) {
                def targetPath = details.relativePath.pathString.substring(infinityConfigPrefix.length())
                file("run/config/infinity/${targetPath}").parentFile.mkdirs()
            }
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = rootProject.group
            artifactId = "${mod_id}-fabric-1.21.1"
            version = project.version

            artifact(project.tasks.named('remapJar'))
            artifact(project.tasks.named('remapSourcesJar')) {
                classifier = 'sources'
            }

            pom {
                name = "${mod_name} (Fabric 1.21.1)"
                description = mod_description
            }
        }
    }
}
