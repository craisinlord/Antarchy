plugins {
    id 'fabric-loom' version "1.17-SNAPSHOT"
    id "com.matthewprenger.cursegradle" version "1.4.0"
    id "me.modmuss50.mod-publish-plugin" version "0.5.1"
}

base {
    archivesName = mod_id
}
jar {
    archiveAppendix = "1.21.1-fabric"
}
version = "${mod_version}"

// Handle duplicates from common-1.21.1's resources
tasks.withType(AbstractCopyTask).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Add common-1.21.1's sources directly — this module compiles them itself.
sourceSets {
    main {
        java {
            srcDirs project(':common-1.21.1').sourceSets.main.java.srcDirs
        }
        resources {
            srcDir project(':common-1.21.1').sourceSets.main.resources.srcDirs
        }
    }
}

ExternalModuleDependency infinityDep;
dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version_1_21_1}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version_1_21_1}"
    modApi "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_1_21_1}"
    modLocalRuntime "maven.modrinth:midnightlib:${midnightlib}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-${rootProject.minecraft_version_1_21_1}:${geckolib_version}"
    modImplementation "maven.modrinth:antos:${project.antos_version}"
    if (providers.gradleProperty('antarchySodiumCompatTest').orNull == 'true') {
        modLocalRuntime "net.caffeinemc:sodium-fabric:${project.sodium_version}"
    }
    compileOnly "net.caffeinemc:sodium-fabric:${project.sodium_version}"
    modCompileOnly("curse.maven:intapi-${intapi_curseforge_id}:${intapi_curseforge_file_id_fabric}")
    modLocalRuntime("curse.maven:intapi-${intapi_curseforge_id}:${intapi_curseforge_file_id_fabric}")
    modLocalRuntime("dev.architectury:architectury-fabric:${architectury_api_version}")
    compileOnly "mezz.jei:jei-${rootProject.minecraft_version_1_21_1}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${rootProject.minecraft_version_1_21_1}-fabric-api:${jei_version}"
    modLocalRuntime "mezz.jei:jei-${rootProject.minecraft_version_1_21_1}-fabric:${jei_version}"

    infinityDep = modImplementation "maven.modrinth:infinite-dimensions:${project.infinite_dimensions_version}"
    modImplementation "maven.modrinth:gravity-changer-unofficial-port:${project.gravity_api_version}"
    modCompileOnly "maven.modrinth:sable:${project.sable_version}"
    modCompileOnly "maven.modrinth:stellarview:${project.stellarview_version}"

    modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    modImplementation "com.terraformersmc:modmenu:${mod_menu}"
    modImplementation "maven.modrinth:sizeable-foliage:${project.sizeable_foliage_version}"

    annotationProcessor "org.spongepowered:mixin:0.8.7:processor"
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixin_extras_1_21_1}"))
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "antarchy.mixins.refmap.json"
    }
}

processResources {
    var replaceProperties = [
        version              : project.version,
        minecraft_version    : "${rootProject.minecraft_version_1_21_1}",
        fabric_loader_version: fabric_loader_version_1_21_1,
        architectury_api_version: architectury_api_version,
        mod_id               : mod_id,
        mod_name             : mod_name,
        mod_description      : mod_description,
        mod_author           : mod_author,
        license              : license,
        homepage_url         : homepage_url,
        issues_url           : issues_url,
        sources_url          : sources_url,
        logo_fabric          : logo_fabric
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

// common-1.21.1's mixins.json ships refmap-free (NeoForge needs no refmap), but Fabric
// does — inject the refmap key into fabric's own copy of the shared file after copying.
tasks.named('processResources', ProcessResources).configure {
    doLast {
        ['antarchy-common.mixins.json', 'antarchy-sodium.mixins.json'].each { configName ->
            var mixinConfig = new File(destinationDir, configName)
            var json = new groovy.json.JsonSlurper().parse(mixinConfig)
            json.put('refmap', 'antarchy.mixins.refmap.json')
            mixinConfig.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
        }
    }
}

tasks.matching { it.name in ["runClient", "runServer", "runDatagen"] }.configureEach {
    doFirst {
        def infinityConfigPrefix = "config/common/"
        zipTree(rootProject.file("infinite_dimensions_jars/infinity-2.7.3+${rootProject.minecraft_version_1_21_1}-fabric.jar")).visit { details ->
            if (!details.directory && details.relativePath.pathString.startsWith(infinityConfigPrefix)) {
                def targetPath = details.relativePath.pathString.substring(infinityConfigPrefix.length())
                file("run/config/infinity/${targetPath}").parentFile.mkdirs()
            }
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = rootProject.group
            artifactId = "${mod_id}-fabric-${rootProject.minecraft_version_1_21_1}"
            version = project.version

            artifact(project.tasks.named('remapJar'))
            artifact(project.tasks.named('remapSourcesJar')) {
                classifier = 'sources'
            }

            pom {
                name = "${mod_name} (Fabric ${rootProject.minecraft_version_1_21_1})"
                description = mod_description
            }
        }
    }
}
