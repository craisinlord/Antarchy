plugins {
    id 'net.fabricmc.fabric-loom'
}

base {
    archivesName = mod_id
}
version = "${mod_version}+26.3-fabric"

tasks.withType(AbstractCopyTask).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xmaxerrs', '100000']
}

sourceSets {
    main {
        java {
            srcDirs project(':common-26.3').sourceSets.main.java.srcDirs
        }
        resources {
            srcDir project(':common-26.3').sourceSets.main.resources.srcDirs
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version_26_3}"

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version_26_3}"
    api "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_26_3}"
    implementation "maven.modrinth:geckolib:${geckolib_modrinth_version_fabric_26_3}"

    implementation files("$rootDir/jars_26/anthology-${anthology_version_26}+26.3-fabric.jar")
    implementation files("$rootDir/jars_26/antos-fabric-26.3-${antos_version_26}.jar")
    implementation files("$rootDir/jars_26/integrated_api-fabric-26.3-${intapi_version_26}.jar")
    implementation files("$rootDir/jars_26/sizeable_foliage-fabric-26.3-${sizeable_foliage_version_26}.jar")
    compileOnly files("$rootDir/jars_26/sodium-fabric-${sodium_version_26_3}.jar")
    if (providers.gradleProperty('antarchySodiumCompatTest').orNull == 'true') {
        localRuntime files("$rootDir/jars_26/sodium-fabric-${sodium_version_26_3}.jar")
    }

    compileOnly "mezz.jei:jei-26.3-common-api:${jei_version_26_3}"
    compileOnly "mezz.jei:jei-26.3-fabric-api:${jei_version_26_3}"

    localRuntime "maven.modrinth:midnightlib:${midnightlib_version_26_3}"

    compileOnly "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version_26_1}"
    compileOnly "com.terraformersmc:modmenu:${modmenu_version_26_1}"
}

loom {
    runs {
        gametest {
            server()
            name = "Game Test"
            vmArg "-Dfabric-api.gametest"
            runDir "build/gametest"
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        version              : project.version,
        minecraft_version    : minecraft_version_26_3,
        fabric_loader_version: fabric_loader_version_26_3,
        antos_version        : antos_version_26,
        mod_id               : mod_id,
        mod_name             : mod_name,
        mod_description      : mod_description,
        mod_author           : mod_author,
        license              : license,
        homepage_url         : homepage_url,
        issues_url           : issues_url,
        sources_url          : sources_url,
        logo_fabric          : logo_fabric
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = rootProject.group
            artifactId = "${mod_id}-fabric-26.3"
            version = project.version

            artifact jar
            artifact sourcesJar

            pom {
                name = "${mod_name} (Fabric 26.3)"
                description = mod_description
            }
        }
    }
}
