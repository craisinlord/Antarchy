plugins {
    id 'java-library'
}

base {
    archivesName = "${mod_id}-common-1.21.1"
}

// Source-only module — each loader module compiles these sources itself.
tasks.named('compileJava').configure {
    enabled = false
}

tasks.named('jar').configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.allJava
    from sourceSets.main.resources
}

dependencies {
    compileOnly("curse.maven:intapi-${intapi_curseforge_id}:${intapi_curseforge_file_id_neoforge}")
    compileOnly(files("$rootDir/infinite_dimensions_jars/infinity-2.7.2+1.21.1-neoforge.jar"))
    compileOnly(files("$rootDir/infinite_dimensions_jars/gravity-api-1.0.7-1.20.1.jar"))
    compileOnly(files("$rootDir/infinite_dimensions_jars/sable-neoforge-1.21.1-2.0.3.jar"))
    compileOnly(files("$rootDir/sizeable_foliage_jars/sizeable_foliage-neoforge-1.21.1-1.0.0.jar"))
    compileOnly("software.bernie.geckolib:geckolib-neoforge-1.21.1:${geckolib_version}")
    compileOnly("mezz.jei:jei-1.21.1-common-api:${jei_version}")
}
